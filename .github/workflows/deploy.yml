name: Deploy Web & Build Android App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install pnpm 📦
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies 🔧
        run: pnpm install
        env:
          # onnxruntime-node (used only by local eval scripts) would otherwise download CUDA binaries on Linux.
          ONNXRUNTIME_NODE_INSTALL: skip

      - name: Build 🏗️
        run: pnpm build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages

  build-android-twa:
    needs: build-and-deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17 ☕
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK 🤖
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools 🔧
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Configure Bubblewrap & Generate TWA Project 📦
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # Write Bubblewrap config pointing to GitHub runner's JDK & Android SDK
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

          # Install Bubblewrap packages in /tmp/bw-tools so repo package.json is untouched
          mkdir -p /tmp/bw-tools
          npm --prefix /tmp/bw-tools install @bubblewrap/core@1.22.0 @bubblewrap/cli@1.22.0
          export NODE_PATH="/tmp/bw-tools/node_modules"

          # Compute versionName & monotonically increasing versionCode from git tag (e.g. v1.11.3 -> 1.11.3, code 11103)
          node - << 'EOF'
          const fs = require('fs');
          const { TwaManifest, TwaGenerator } = require('@bubblewrap/core');

          (async () => {
            const rawTag = process.env.TAG_NAME || 'v1.0.0';
            const cleanVer = rawTag.replace(/^v/, '');
            const parts = cleanVer.split('.').map((n) => parseInt(n, 10) || 0);
            const versionCode = (parts[0] || 1) * 10000 + (parts[1] || 0) * 100 + (parts[2] || 0);

            const manifestJson = JSON.parse(fs.readFileSync('./twa-manifest.json', 'utf8'));
            manifestJson.appVersionName = cleanVer;
            manifestJson.appVersionCode = versionCode;
            if (process.env.ANDROID_KEY_ALIAS) {
              manifestJson.signingKey.alias = process.env.ANDROID_KEY_ALIAS;
            }
            fs.writeFileSync('./twa-manifest.json', JSON.stringify(manifestJson, null, 2));

            fs.mkdirSync('./.twa-build', { recursive: true });
            const twaManifest = new TwaManifest(manifestJson);
            const generator = new TwaGenerator();
            await generator.createTwaProject('./.twa-build', twaManifest);
            fs.copyFileSync('./twa-manifest.json', './.twa-build/twa-manifest.json');
            console.log(`Generated TWA project for v${cleanVer} (versionCode: ${versionCode})`);
          })();
          EOF

          # Decode signing keystore into .twa-build/android.keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > ./.twa-build/android.keystore

      - name: Build Signed AAB & APK 🏗️
        working-directory: ./.twa-build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          /tmp/bw-tools/node_modules/.bin/bubblewrap build --skipPwaValidation
          VERSION="${GITHUB_REF_NAME#v}"
          cp app-release-bundle.aab "../khorchapati-v${VERSION}.aab"
          cp app-release-signed.apk "../khorchapati-v${VERSION}.apk"

      - name: Publish GitHub Release (AAB + APK) 🎉
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            khorchapati-*.aab
            khorchapati-*.apk
            public/.well-known/assetlinks.json
