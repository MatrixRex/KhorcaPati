name: Deploy Web & Build Android App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install pnpm 📦
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies 🔧
        run: pnpm install
        env:
          # onnxruntime-node (used only by local eval scripts) would otherwise download CUDA binaries on Linux.
          ONNXRUNTIME_NODE_INSTALL: skip

      - name: Build 🏗️
        run: pnpm build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages

  build-android-twa:
    needs: build-and-deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17 ☕
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android Build Tools 🔧
        run: |
          SDKMANAGER=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Configure Bubblewrap & Generate TWA Project 📦
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # Install @bubblewrap/core in /tmp/bw-tools so repo package.json is untouched
          mkdir -p /tmp/bw-tools
          npm --prefix /tmp/bw-tools install @bubblewrap/core@1.22.0 lodash
          export NODE_PATH="/tmp/bw-tools/node_modules"

          # Compute versionName & monotonically increasing versionCode from git tag (e.g. v1.11.5 -> 1.11.5, code 11105)
          node - << 'EOF'
          const fs = require('fs');
          const { TwaManifest, TwaGenerator } = require('@bubblewrap/core');

          (async () => {
            const rawTag = process.env.TAG_NAME || 'v1.0.0';
            const cleanVer = rawTag.replace(/^v/, '');
            const parts = cleanVer.split('.').map((n) => parseInt(n, 10) || 0);
            const versionCode = (parts[0] || 1) * 10000 + (parts[1] || 0) * 100 + (parts[2] || 0);

            const manifestJson = JSON.parse(fs.readFileSync('./twa-manifest.json', 'utf8'));
            manifestJson.appVersionName = cleanVer;
            manifestJson.appVersionCode = versionCode;
            manifestJson.minSdkVersion = Math.max(manifestJson.minSdkVersion || 24, 24);
            if (process.env.ANDROID_KEY_ALIAS) {
              manifestJson.signingKey.alias = process.env.ANDROID_KEY_ALIAS;
            }
            fs.writeFileSync('./twa-manifest.json', JSON.stringify(manifestJson, null, 2));

            fs.mkdirSync('./twa-build', { recursive: true });
            const twaManifest = new TwaManifest(manifestJson);
            const generator = new TwaGenerator();
            await generator.createTwaProject('./twa-build', twaManifest);
            fs.copyFileSync('./twa-manifest.json', './twa-build/twa-manifest.json');

            // Ensure minSdkVersion 24 and targetSdkVersion/compileSdkVersion 36 in app/build.gradle
            let appGradle = fs.readFileSync('./twa-build/app/build.gradle', 'utf8');
            appGradle = appGradle
              .replace(/minSdkVersion\s+\d+/g, 'minSdkVersion 24')
              .replace(/compileSdkVersion\s+\d+/g, 'compileSdkVersion 36')
              .replace(/targetSdkVersion\s+\d+/g, 'targetSdkVersion 36');
            fs.writeFileSync('./twa-build/app/build.gradle', appGradle);

            console.log(`Generated TWA project for v${cleanVer} (versionCode: ${versionCode}, minSdk: 24, targetSdk: 36)`);
          })();
          EOF

          # Decode signing keystore into twa-build/android.keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > ./twa-build/android.keystore

      - name: Build Signed AAB & APK 🏗️
        working-directory: ./twa-build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

          VERSION="${GITHUB_REF_NAME#v}"

          # Sign the Play Store App Bundle (.aab) with jarsigner
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore android.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            app/build/outputs/bundle/release/app-release.aab "$ANDROID_KEY_ALIAS"
          cp app/build/outputs/bundle/release/app-release.aab "../khorchapati-v${VERSION}.aab"

          # Align and sign the installable APK (.apk) with zipalign & apksigner
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/zipalign" -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app-release-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks android.keystore \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "../khorchapati-v${VERSION}.apk" \
            app-release-aligned.apk

      - name: Publish GitHub Release (AAB + APK) 🎉
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            khorchapati-*.aab
            khorchapati-*.apk
            public/.well-known/assetlinks.json
